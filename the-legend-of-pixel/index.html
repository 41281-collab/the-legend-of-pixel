<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Legend of Pixel: A Link to the Past (SNES Style)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #0b0f19;
            color: #ffffff;
            user-select: none;
            touch-action: manipulation;
        }

        /* SNES Crisp Pixel Rendering */
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 15px rgba(34, 197, 94, 0.3);
            border: 4px solid #3b2010;
        }

        /* Mode 7 / Scanline CRT Overlay */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.18) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 20;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* SNES Controller Buttons */
        .snes-btn {
            background: linear-gradient(180deg, #4b5563 0%, #1f2937 100%);
            border: 2px solid #6b7280;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.2), 0 4px 0 #111827;
        }
        .snes-btn:active {
            transform: translateY(2px);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 2px 0 #111827;
        }

        .snes-a-btn {
            background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%);
            border: 2px solid #fca5a5;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.4), 0 4px 0 #7f1d1d;
        }
        .snes-a-btn:active {
            transform: translateY(3px);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 1px 0 #7f1d1d;
        }
    </style>
</head>

        class SNESAudio {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playSword() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                
                const bufferSize = this.ctx.sampleRate * 0.12;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1200, now);
                filter.frequency.exponentialRampToValueAtTime(300, now + 0.12);
                filter.Q.value = 3.0;

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);

                const osc = this.ctx.createOscillator();
                const oscGain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);

                oscGain.gain.setValueAtTime(0.2, now);
                oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                osc.connect(oscGain);
                oscGain.connect(this.ctx.destination);
                osc.start(now);
            }

            playHit() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.15);

                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
            }

            playKill() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.08);
                osc.frequency.linearRampToValueAtTime(120, now + 0.22);

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
            }

            playRupee() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc1.type = 'sine';
                osc2.type = 'triangle';

                osc1.frequency.setValueAtTime(987.77, now); 
                osc1.frequency.setValueAtTime(1318.51, now + 0.08); 

                osc2.frequency.setValueAtTime(1975.53, now); 
                osc2.frequency.setValueAtTime(2637.02, now + 0.08); 

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.25);
                osc2.stop(now + 0.25);
            }

            playPotSmash() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.15;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.setValueAtTime(1000, now);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
            }

            playTransition() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.25);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.25);
            }

            playGameOver() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(261.63, now); 
                osc.frequency.setValueAtTime(246.94, now + 0.15); 
                osc.frequency.setValueAtTime(233.08, now + 0.30); 
                osc.frequency.setValueAtTime(220.00, now + 0.45); 

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.8);
            }

            playFanfare() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    gain.gain.setValueAtTime(0.3, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.25);
                });
            }
        }

        const player = {
            x: 7 * TILE_SIZE + 3,
            y: 6 * TILE_SIZE + HUD_HEIGHT + 3,
            width: 26,
            height: 26,
            speed: 3.0,
            dir: 'DOWN',
            maxHealth: 6,

            attackFrame: 0,
            attackMaxFrames: 12,
            invulnerableTimer: 0,

            reset() {
                this.x = 7 * TILE_SIZE + 3;
                this.y = 6 * TILE_SIZE + HUD_HEIGHT + 3;
                this.dir = 'DOWN';
                this.health = this.maxHealth;
                this.isAttacking = false;
                this.attackFrame = 0;
                this.invulnerableTimer = 0;
            },

            getSwordArc() {
                const reach = 45;
                const progress = this.attackFrame / this.attackMaxFrames;
                const sweepAngle = (progress * Math.PI) - (Math.PI / 2);

                let baseAngle = 0;
                if (this.dir === 'DOWN') baseAngle = Math.PI / 2;
                if (this.dir === 'UP') baseAngle = -Math.PI / 2;
                if (this.dir === 'LEFT') baseAngle = Math.PI;
                if (this.dir === 'RIGHT') baseAngle = 0;

                const currentAngle = baseAngle + sweepAngle;
                const cx = this.x + this.width / 2;
                const cy = this.y + this.height / 2;

                const tipX = cx + Math.cos(currentAngle) * reach;
                const tipY = cy + Math.sin(currentAngle) * reach;

                return {
                    cx, cy, tipX, tipY, angle: currentAngle,
                    box: {
                        x: Math.min(cx, tipX) - 12,
                        y: Math.min(cy, tipY) - 12,
                        w: Math.abs(tipX - cx) + 24,
                        h: Math.abs(tipY - cy) + 24
                    }
                };
            }
        };

        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.width = 26;
                this.height = 26;
                this.dir = ['UP', 'DOWN', 'LEFT', 'RIGHT'][Math.floor(Math.random() * 4)];
                this.moveTimer = 0;
                this.animTimer = 0;
                this.animFrame = 0;
                this.isHit = 0;
                this.shootCooldown = 0;

                if (type === 'SOLDIER') {
                    this.speed = 1.6;
                    this.hp = 3;
                } else if (type === 'OCTOROK') {
                    this.speed = 1.2;
                    this.hp = 2;
                } else if (type === 'SLIME') {
                    this.speed = 2.2;
                    this.hp = 1;
                }
            }

            update(roomObstacles) {
                if (this.isHit > 0) this.isHit--;

                this.moveTimer++;
                if (this.moveTimer > 50 + Math.random() * 50) {
                    this.dir = ['UP', 'DOWN', 'LEFT', 'RIGHT'][Math.floor(Math.random() * 4)];
                    this.moveTimer = 0;
                }

                this.animTimer++;
                if (this.animTimer > 8) {
                    this.animFrame = (this.animFrame + 1) % 2;
                    this.animTimer = 0;
                }

                if (this.type === 'OCTOROK') {
                    this.shootCooldown++;
                    if (this.shootCooldown > 120) {
                        this.shootCooldown = 0;
                        let pVx = 0, pVy = 0;
                        if (this.dir === 'UP') pVy = -4;
                        if (this.dir === 'DOWN') pVy = 4;
                        if (this.dir === 'LEFT') pVx = -4;
                        if (this.dir === 'RIGHT') pVx = 4;
                        projectiles.push({
                            x: this.x + 10,
                            y: this.y + 10,
                            vx: pVx,
                            vy: pVy,
                            life: 100
                        });
                    }
                }

                let dx = 0, dy = 0;
                if (this.dir === 'UP') dy = -this.speed;
                if (this.dir === 'DOWN') dy = this.speed;
                if (this.dir === 'LEFT') dx = -this.speed;
                if (this.dir === 'RIGHT') dx = this.speed;

                const nextX = this.x + dx;
                const nextY = this.y + dy;

                const minX = TILE_SIZE;
                const maxX = SCREEN_WIDTH - TILE_SIZE - this.width;
                const minY = HUD_HEIGHT + TILE_SIZE;
                const maxY = SCREEN_HEIGHT - TILE_SIZE - this.height;

                if (nextX >= minX && nextX <= maxX && nextY >= minY && nextY <= maxY) {
                    let collide = false;
                    for (let obs of roomObstacles) {
                        if (checkRectOverlap({ x: nextX, y: nextY, w: this.width, h: this.height }, obs)) {
                            collide = true;
                            break;
                        }
                    }
                    if (!collide) {
                        this.x = nextX;
                        this.y = nextY;
                    } else {
                        this.dir = ['UP', 'DOWN', 'LEFT', 'RIGHT'][Math.floor(Math.random() * 4)];
                    }
                } else {
                    this.dir = ['UP', 'DOWN', 'LEFT', 'RIGHT'][Math.floor(Math.random() * 4)];
                }
            }
        }

        class Pot {

        class DropItem {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'RUPEE' or 'HEART'
                this.life = 450;
                this.bounceY = 0;
                this.bounceSpeed = -3;
            }

            update() {
                this.life--;
                if (this.bounceY < 0 || this.bounceSpeed < 0) {
                    this.bounceY += this.bounceSpeed;
                    this.bounceSpeed += 0.4;
                    if (this.bounceY > 0) this.bounceY = 0;
                }
            }
        }

        class Room {
            constructor(rx, ry) {
                this.rx = rx;
                this.ry = ry;
                this.grid = [];
                this.obstacles = [];
                this.pots = [];
                this.enemies = [];
                this.drops = [];

                this.generate();
            }

            generate() {
                const isStartingCave = (this.rx === 0 && this.ry === 0);

                for (let r = 0; r < MAP_ROWS; r++) {
                    this.grid[r] = [];
                    for (let c = 0; c < MAP_COLS; c++) {
                        const isTop = (r === 0);
                        const isBottom = (r === MAP_ROWS - 1);
                        const isLeft = (c === 0);
                        const isRight = (c === MAP_COLS - 1);

                        // Doorways (2 tiles wide)
                        // In the starting cave (0,0), only the South door (bottom) is open to leave
                        const isTopDoor = !isStartingCave && isTop && (c === 7 || c === 8);
                        const isBottomDoor = isBottom && (c === 7 || c === 8);
                        const isLeftDoor = !isStartingCave && isLeft && (r === 5 || r === 6);
                        const isRightDoor = !isStartingCave && isRight && (r === 5 || r === 6);

                        if (isTopDoor || isBottomDoor || isLeftDoor || isRightDoor) {
                            this.grid[r][c] = 0; // Door corridor (clear passage)
                        } else if (isTop || isBottom || isLeft || isRight) {
                            this.grid[r][c] = 1; // Perimeter Wall
                            this.obstacles.push({
                                x: c * TILE_SIZE,
                                y: r * TILE_SIZE + HUD_HEIGHT,
                                w: TILE_SIZE,
                                h: TILE_SIZE
                            });
                        } else {
                            this.grid[r][c] = 0; // Floor
                        }
                    }
                }

                // If starting cave, no random trees/rocks/enemies/pots
                if (isStartingCave) {
                    return;
                }

                // Random Trees/Rocks (leaving door corridors clear)
                const obstacleCount = 3 + Math.floor(Math.random() * 5);
                for (let i = 0; i < obstacleCount; i++) {
                    const c = 2 + Math.floor(Math.random() * (MAP_COLS - 4));
                    const r = 2 + Math.floor(Math.random() * (MAP_ROWS - 4));

                    const isCorridorX = (c === 7 || c === 8);
                    const isCorridorY = (r === 5 || r === 6);

                    if (!isCorridorX && !isCorridorY && this.grid[r][c] === 0) {
                        this.grid[r][c] = 2;
                        this.obstacles.push({
                            x: c * TILE_SIZE,
                            y: r * TILE_SIZE + HUD_HEIGHT,
                            w: TILE_SIZE,
                            h: TILE_SIZE
                        });
                    }
                }

                // Breakable Pots
                const potCount = 2 + Math.floor(Math.random() * 4);
                for (let p = 0; p < potCount; p++) {
                    const c = 2 + Math.floor(Math.random() * (MAP_COLS - 4));
                    const r = 2 + Math.floor(Math.random() * (MAP_ROWS - 4));
                    if (this.grid[r][c] === 0) {
                        this.pots.push(new Pot(c * TILE_SIZE, r * TILE_SIZE + HUD_HEIGHT));
                    }
                }

                // Enemies scaled by distance from start room (0,0)
                const dist = Math.abs(this.rx) + Math.abs(this.ry);
                const enemyCount = Math.min(2 + Math.floor(dist * 0.9), 8);
                const types = ['SOLDIER', 'OCTOROK', 'SLIME'];

                for (let e = 0; e < enemyCount; e++) {
                    let ex, ey, valid = false;
                    let attempts = 0;
                    while (!valid && attempts < 50) {
                        attempts++;
                        const c = 2 + Math.floor(Math.random() * (MAP_COLS - 4));
                        const r = 2 + Math.floor(Math.random() * (MAP_ROWS - 4));
                        if (this.grid[r][c] === 0) {
                            ex = c * TILE_SIZE + 3;
                            ey = r * TILE_SIZE + HUD_HEIGHT + 3;
                            valid = true;
                        }
                    }
                    if (valid) {
                        const enemyType = types[Math.floor(Math.random() * types.length)];
                        this.enemies.push(new Enemy(ex, ey, enemyType));
                    }
                }
            }
        }

        function getRoomKey(rx, ry) { return `${rx},${ry}`; }

        function getOrCreateRoom(rx, ry) {
            const key = getRoomKey(rx, ry);
            if (!visitedRooms.has(key)) {
                visitedRooms.set(key, new Room(rx, ry));
            }
            return visitedRooms.get(key);
        }

        function checkRectOverlap(r1, r2) {
            return (r1.x < r2.x + r2.w &&
                    r1.x + r1.w > r2.x &&
                    r1.y < r2.y + r2.h &&
                    r1.y + r1.h > r2.y);
        }

        function drawTriforceFloor(cx, cy) {
            const size = 18; // Triangle dimension
            const h = size * (Math.sqrt(3) / 2);

            function drawTriangle(tx, ty, scale = 1) {
                const s = size * scale;
                const sh = h * scale;
                ctx.beginPath();
                ctx.moveTo(tx, ty - sh / 2);
                ctx.lineTo(tx - s / 2, ty + sh / 2);
                ctx.lineTo(tx + s / 2, ty + sh / 2);
                ctx.closePath();
            }

            // Soft golden aura around the emblem
            ctx.fillStyle = 'rgba(251, 191, 36, 0.15)';
            drawTriangle(cx, cy - h / 2, 2.2);
            ctx.fill();

            // 3 Triforce Triangles (Power, Wisdom, Courage)
            const triangles = [
                { x: cx, y: cy - h / 2 },             // Top
                { x: cx - size / 2, y: cy + h / 2 },  // Bottom Left
                { x: cx + size / 2, y: cy + h / 2 }   // Bottom Right
            ];

            triangles.forEach(t => {
                // Dark Gold Border
                ctx.fillStyle = PALETTE.TRIFORCE_DARK;
                drawTriangle(t.x, t.y + 1, 1.08);
                ctx.fill();

                // Main Golden Body
                ctx.fillStyle = PALETTE.TRIFORCE_GOLD;
                drawTriangle(t.x, t.y);
                ctx.fill();

                // Inner Highlight
                ctx.fillStyle = PALETTE.TRIFORCE_GLOW;
                drawTriangle(t.x - 1, t.y - 1, 0.45);
                ctx.fill();
            });
        }

        function drawSNESPlayer() {
            if (player.invulnerableTimer > 0 && Math.floor(player.invulnerableTimer / 3) % 2 === 0) {
                return;
            }

            const x = Math.round(player.x);
            const y = Math.round(player.y);

            // Sombra no chão
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.beginPath();
            ctx.ellipse(x + 13, y + 24, 10, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Botas (Brown Boots)
            ctx.fillStyle = PALETTE.LINK_BOOTS;
            if (player.dir === 'DOWN' || player.dir === 'UP') {
                ctx.fillRect(x + 6, y + 21, 5, 5);
                ctx.fillRect(x + 15, y + 21, 5, 5);
            } else if (player.dir === 'LEFT') {
                ctx.fillRect(x + 5, y + 21, 6, 5);
                ctx.fillRect(x + 13, y + 21, 5, 5);
            } else if (player.dir === 'RIGHT') {
                ctx.fillRect(x + 8, y + 21, 5, 5);
                ctx.fillRect(x + 15, y + 21, 6, 5);
            }

            // Túnica Verde Clássica + Detalhes de gola branca
            ctx.fillStyle = '#ffffff'; // Camisa por baixo
            ctx.fillRect(x + 4, y + 10, 18, 3);

            ctx.fillStyle = PALETTE.LINK_TUNIC;
            ctx.fillRect(x + 5, y + 11, 16, 10);

            // Cinto marrom com fivela dourada
            ctx.fillStyle = PALETTE.LINK_BELT;
            ctx.fillRect(x + 5, y + 16, 16, 3);
            ctx.fillStyle = '#f59e0b'; // Fivela dourada
            ctx.fillRect(x + 11, y + 16, 4, 3);

            // Escudo Azul Hylian do SNES
            function drawShield(sx, sy) {
                ctx.fillStyle = PALETTE.SHIELD_GOLD;
                ctx.fillRect(sx, sy, 7, 10);
                ctx.fillStyle = PALETTE.SHIELD_BLUE;
                ctx.fillRect(sx + 1, sy + 1, 5, 8);
                ctx.fillStyle = '#ef4444'; // Emblema do Escudo
                ctx.fillRect(sx + 2, sy + 3, 3, 3);
            }

            if (player.dir === 'DOWN') {
                drawShield(x, y + 11);
            } else if (player.dir === 'RIGHT') {
                drawShield(x + 2, y + 11);
            } else if (player.dir === 'LEFT') {
                drawShield(x + 17, y + 11);
            }

            // Rosto / Pele
            ctx.fillStyle = PALETTE.LINK_SKIN;
            ctx.fillRect(x + 6, y + 4, 14, 8);

            // Cabelo Loiro do Link
            ctx.fillStyle = PALETTE.LINK_HAIR;
            if (player.dir === 'DOWN') {
                ctx.fillRect(x + 4, y + 3, 18, 4);  // Franja loira
                ctx.fillRect(x + 4, y + 6, 3, 4);   // Cabelo lateral esquerdo
                ctx.fillRect(x + 19, y + 6, 3, 4);  // Cabelo lateral direito
            } else if (player.dir === 'UP') {
                ctx.fillRect(x + 4, y + 2, 18, 7);  // Cabelo atrás
            } else if (player.dir === 'LEFT') {
                ctx.fillRect(x + 4, y + 3, 16, 4);
                ctx.fillRect(x + 4, y + 6, 4, 4);
            } else if (player.dir === 'RIGHT') {
                ctx.fillRect(x + 6, y + 3, 16, 4);
                ctx.fillRect(x + 18, y + 6, 4, 4);
            }

            // Gorro Verde Icônico e cauda dobrada do chapéu
            ctx.fillStyle = PALETTE.LINK_HAT;
            ctx.fillRect(x + 5, y, 16, 4);
            if (player.dir === 'DOWN' || player.dir === 'RIGHT') {
                ctx.fillRect(x + 18, y + 1, 5, 6); // Cauda do chapéu para direita
                ctx.fillRect(x + 21, y + 5, 4, 5);
            } else if (player.dir === 'LEFT') {
                ctx.fillRect(x + 3, y + 1, 5, 6);  // Cauda do chapéu para esquerda
                ctx.fillRect(x + 1, y + 5, 4, 5);
            } else if (player.dir === 'UP') {
                ctx.fillRect(x + 10, y + 3, 6, 8);  // Cauda caindo para trás
            }

            // Olhos
            ctx.fillStyle = '#000000';
            if (player.dir === 'DOWN') {
                ctx.fillRect(x + 8, y + 7, 2, 3);
                ctx.fillRect(x + 16, y + 7, 2, 3);
            } else if (player.dir === 'LEFT') {
                ctx.fillRect(x + 7, y + 7, 2, 3);
            } else if (player.dir === 'RIGHT') {
                ctx.fillRect(x + 17, y + 7, 2, 3);
            }

            // Animação de ataque com a Master Sword
            if (player.isAttacking) {
                const arc = player.getSwordArc();

                // Master Sword Blue/Cyan Aura Glow
                ctx.strokeStyle = PALETTE.MASTER_GLOW;
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(arc.cx, arc.cy);
                ctx.lineTo(arc.tipX, arc.tipY);
                ctx.stroke();

                // Master Sword Silver Core Blade
                ctx.strokeStyle = PALETTE.MASTER_BLADE;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(arc.cx, arc.cy);
                ctx.lineTo(arc.tipX, arc.tipY);
                ctx.stroke();

                // Master Sword Iconic Blue Winged Hilt
                ctx.fillStyle = PALETTE.MASTER_HILT;
                ctx.beginPath();
                ctx.arc(arc.cx, arc.cy, 6, 0, Math.PI * 2);
                ctx.fill();

                // Yellow Triforce Gem at Crossguard
                ctx.fillStyle = PALETTE.MASTER_GEM;
                ctx.fillRect(arc.cx - 2, arc.cy - 2, 4, 4);

                // Blade Energy Sparks
                if (Math.random() < 0.75) {
                    particles.push({
                        x: arc.tipX, y: arc.tipY,
                        vx: (Math.random() - 0.5) * 3,
                        vy: (Math.random() - 0.5) * 3,
                        size: 2 + Math.random() * 2,
                        color: Math.random() < 0.5 ? PALETTE.MASTER_GLOW : PALETTE.TRIFORCE_GLOW,
                        life: 10
                    });
                }
            }
        }

        function drawSNESEnemy(enemy) {
            const x = Math.round(enemy.x);
            const y = Math.round(enemy.y);

            if (enemy.isHit > 0 && Math.floor(enemy.isHit / 2) % 2 === 0) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x, y, enemy.width, enemy.height);
                return;
            }

            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(x + 13, y + 24, 9, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            if (enemy.type === 'SOLDIER') {
                ctx.fillStyle = PALETTE.SOLDIER_ARMOR;
                ctx.fillRect(x + 4, y + 8, 18, 14);
                ctx.fillStyle = PALETTE.SOLDIER_HELM;
                ctx.fillRect(x + 6, y + 2, 14, 8);
                ctx.fillStyle = '#a0aec0';
                ctx.fillRect(x + 22, y, 3, 24);
            } else if (enemy.type === 'OCTOROK') {
                ctx.fillStyle = PALETTE.OCTOROK_RED;
                ctx.fillRect(x + 3, y + 4, 20, 18);
                ctx.fillStyle = '#000';
                ctx.fillRect(x + 9, y + 16, 8, 6);
                ctx.fillStyle = '#fff';
                ctx.fillRect(x + 5, y + 6, 4, 4);
                ctx.fillRect(x + 17, y + 6, 4, 4);
            } else if (enemy.type === 'SLIME') {
                ctx.fillStyle = PALETTE.SLIME_GREEN;
                const bounce = (enemy.animFrame === 0) ? 0 : -3;
                ctx.fillRect(x + 4, y + 8 + bounce, 18, 14);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + 8, y + 10 + bounce, 3, 3);
            }
        }

        function drawRoom(room) {
            const isStartingCave = (room.rx === 0 && room.ry === 0);

            if (isStartingCave) {
                // Dark Cavern Floor
                ctx.fillStyle = '#09070f';
                ctx.fillRect(0, HUD_HEIGHT, SCREEN_WIDTH, SCREEN_HEIGHT - HUD_HEIGHT);

                // Cavern Stone Floor Grid Pattern
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.lineWidth = 1;
                for (let r = 1; r < MAP_ROWS - 1; r++) {
                    for (let c = 1; c < MAP_COLS - 1; c++) {
                        ctx.strokeRect(c * TILE_SIZE, r * TILE_SIZE + HUD_HEIGHT, TILE_SIZE, TILE_SIZE);
                    }
                }

                // Render Rocky Cave Perimeter Walls
                for (let c = 0; c < MAP_COLS; c++) {
                    drawCaveWallBlock(c * TILE_SIZE, HUD_HEIGHT); // Top Wall
                    if (c !== 7 && c !== 8) {
                        drawCaveWallBlock(c * TILE_SIZE, SCREEN_HEIGHT - TILE_SIZE); // Bottom Wall
                    }
                }
                for (let r = 1; r < MAP_ROWS - 1; r++) {
                    drawCaveWallBlock(0, r * TILE_SIZE + HUD_HEIGHT); // Left Wall
                    drawCaveWallBlock(SCREEN_WIDTH - TILE_SIZE, r * TILE_SIZE + HUD_HEIGHT); // Right Wall
                }

                // Cave Exit Archway at Bottom
                ctx.fillStyle = '#020104';
                ctx.fillRect(7 * TILE_SIZE, SCREEN_HEIGHT - TILE_SIZE, 2 * TILE_SIZE, TILE_SIZE);
                ctx.strokeStyle = '#5c3a21';
                ctx.lineWidth = 3;
                ctx.strokeRect(7 * TILE_SIZE, SCREEN_HEIGHT - TILE_SIZE, 2 * TILE_SIZE, TILE_SIZE);

                // Old Man in Center
                const oldManX = 8 * TILE_SIZE - 16;
                const oldManY = 3 * TILE_SIZE + HUD_HEIGHT;
                drawOldMan(oldManX, oldManY);

                // Two Flanking Fires with ambient illumination
                drawFire(oldManX - 64, oldManY);
                drawFire(oldManX + 64, oldManY);

                // Dialogue Text
                ctx.fillStyle = '#ffffff';
                ctx.font = '9px "Press Start 2P"';
                ctx.textAlign = 'center';

                const t = I18N[currentLang];

                if (!hasSword) {
                    ctx.fillText(t.dangerous, SCREEN_WIDTH / 2, HUD_HEIGHT + 42);
                    ctx.fillText(t.takeSword, SCREEN_WIDTH / 2, HUD_HEIGHT + 60);

                    // Draw Master Sword on Pedestal
                    const pedX = oldManX;
                    const pedY = oldManY + 54;

                    // Pedestal
                    ctx.fillStyle = '#475569';
                    ctx.fillRect(pedX + 4, pedY + 16, 24, 12);
                    ctx.fillStyle = '#94a3b8';
                    ctx.fillRect(pedX + 6, pedY + 14, 20, 4);

                    // Floating Sword
                    const floatY = Math.sin(Date.now() / 200) * 3;
                    ctx.fillStyle = PALETTE.MASTER_HILT;
                    ctx.fillRect(pedX + 10, pedY + 6 + floatY, 12, 4);
                    ctx.fillStyle = PALETTE.MASTER_GEM;
                    ctx.fillRect(pedX + 14, pedY + 6 + floatY, 4, 4);
                    ctx.fillStyle = PALETTE.MASTER_BLADE;
                    ctx.fillRect(pedX + 14, pedY - 6 + floatY, 4, 12);

                    if (Math.random() < 0.2) {
                        spawnSparkles(pedX + 16, pedY + floatY, '#fef08a', 2);
                    }
                } else {
                    ctx.fillText(t.leaveCave, SCREEN_WIDTH / 2, HUD_HEIGHT + 45);
                    ctx.fillText(t.defeatMonsters, SCREEN_WIDTH / 2, HUD_HEIGHT + 65);
                }

                ctx.textAlign = 'left';
                return;
            }

            // Gray stone background pattern
            ctx.fillStyle = PALETTE.GRASS_MID;
            ctx.fillRect(0, HUD_HEIGHT, SCREEN_WIDTH, SCREEN_HEIGHT - HUD_HEIGHT);

            // Visual Dark Stone Paths for Doorways (North, South, West, East)
            ctx.fillStyle = '#263342';
            ctx.fillRect(7 * TILE_SIZE, HUD_HEIGHT, 2 * TILE_SIZE, TILE_SIZE);
            ctx.fillRect(7 * TILE_SIZE, SCREEN_HEIGHT - TILE_SIZE, 2 * TILE_SIZE, TILE_SIZE);
            ctx.fillRect(0, HUD_HEIGHT + 5 * TILE_SIZE, TILE_SIZE, 2 * TILE_SIZE);
            ctx.fillRect(SCREEN_WIDTH - TILE_SIZE, HUD_HEIGHT + 5 * TILE_SIZE, TILE_SIZE, 2 * TILE_SIZE);

            // If room below starting cave (rx=0, ry=1), render mountain cave entrance at top door
            if (room.rx === 0 && room.ry === 1) {
                drawCaveMouthEntrance(7 * TILE_SIZE, HUD_HEIGHT);
            }

            // Center Room Golden Triforce Emblem
            const roomCenterX = SCREEN_WIDTH / 2;
            const roomCenterY = HUD_HEIGHT + (SCREEN_HEIGHT - HUD_HEIGHT) / 2;
            drawTriforceFloor(roomCenterX, roomCenterY);

            // Tiles / Obstacles
            for (let r = 0; r < MAP_ROWS; r++) {
                for (let c = 0; c < MAP_COLS; c++) {
                    const tx = c * TILE_SIZE;
                    const ty = r * TILE_SIZE + HUD_HEIGHT;
                    const val = room.grid[r][c];

                    if (val === 1 || val === 2) { // Perimeter or Internal Tree
                        drawSNESTree(tx, ty);
                    }
                }
            }

            // Pots
            for (let pot of room.pots) {
                drawSNESPot(pot.x, pot.y);
            }

            // Drops
            for (let drop of room.drops) {
                if (drop.type === 'RUPEE') {
                    drawSNESRupee(drop.x, drop.y + drop.bounceY);
                } else if (drop.type === 'HEART') {
                    drawSNESHeart(drop.x, drop.y + drop.bounceY, true, false);
                }
            }

            // Enemies
            for (let enemy of room.enemies) {
                drawSNESEnemy(enemy);
            }
        }

        function drawTransition() {
            const currentRoom = getOrCreateRoom(currentRoomX, currentRoomY);
            drawRoom(currentRoom);
            drawSNESPlayer();

            ctx.fillStyle = `rgba(0, 0, 0, ${Math.sin(transitionProgress * Math.PI)})`;
            ctx.fillRect(0, HUD_HEIGHT, SCREEN_WIDTH, SCREEN_HEIGHT - HUD_HEIGHT);
        }

        function update() {
            if (gameState === 'TRANSITION') {
                transitionProgress += 0.08;
                if (transitionProgress >= 1) {
                    currentRoomX = nextRoomX;
                    currentRoomY = nextRoomY;
                    gameState = 'PLAYING';
                    transitionProgress = 0;
                }
                return;
            }

            if (gameState !== 'PLAYING') return;

            const currentRoom = getOrCreateRoom(currentRoomX, currentRoomY);

            // Timers & Cooldowns
            if (player.invulnerableTimer > 0) player.invulnerableTimer--;

            if (player.isAttacking) {
                player.attackFrame++;
                if (player.attackFrame >= player.attackMaxFrames) {
                    player.isAttacking = false;
                    player.attackFrame = 0;
                }
            }

            // Player Movement
            let dx = 0, dy = 0;
            if (keys.up) { dy -= player.speed; player.dir = 'UP'; }
            if (keys.down) { dy += player.speed; player.dir = 'DOWN'; }
            if (keys.left) { dx -= player.speed; player.dir = 'LEFT'; }
            if (keys.right) { dx += player.speed; player.dir = 'RIGHT'; }

            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            // X-axis Movement
            let nextPlayerX = player.x + dx;
            let collideX = false;
            let playerBoxX = { x: nextPlayerX, y: player.y, w: player.width, h: player.height };

            for (let obs of currentRoom.obstacles) {
                if (checkRectOverlap(playerBoxX, obs)) { collideX = true; break; }
            }
            for (let pot of currentRoom.pots) {
                if (checkRectOverlap(playerBoxX, pot)) { collideX = true; break; }
            }
            if (!collideX) player.x = nextPlayerX;

            // Y-axis Movement
            let nextPlayerY = player.y + dy;
            let collideY = false;
            let playerBoxY = { x: player.x, y: nextPlayerY, w: player.width, h: player.height };

            for (let obs of currentRoom.obstacles) {
                if (checkRectOverlap(playerBoxY, obs)) { collideY = true; break; }
            }
            for (let pot of currentRoom.pots) {
                if (checkRectOverlap(playerBoxY, pot)) { collideY = true; break; }
            }
            if (!collideY) player.y = nextPlayerY;

            // Pick up Master Sword in Starting Cave (0,0)
            if (currentRoomX === 0 && currentRoomY === 0 && !hasSword) {
                const pedBox = {
                    x: 8 * TILE_SIZE - 16,
                    y: 3 * TILE_SIZE + HUD_HEIGHT + 50,
                    w: 32,
                    h: 32
                };
                if (checkRectOverlap({ x: player.x, y: player.y, w: player.width, h: player.height }, pedBox)) {
                    hasSword = true;
                    audio.playFanfare();
                    spawnSparkles(pedBox.x + 16, pedBox.y + 16, '#fef08a', 25);
                }
            }

            // Room Boundaries & Door Detection
            const topDoorX = 6 * TILE_SIZE;
            const bottomDoorX = 9 * TILE_SIZE;
            const leftDoorY = HUD_HEIGHT + 4 * TILE_SIZE;
            const rightDoorY = HUD_HEIGHT + 7 * TILE_SIZE;

            const inXDoorway = (player.x + player.width > topDoorX && player.x < bottomDoorX);
            const inYDoorway = (player.y + player.height > leftDoorY && player.y < rightDoorY);

            // Door trigger - North
            if (inXDoorway && player.y <= HUD_HEIGHT + 6) {
                nextRoomX = currentRoomX;
                nextRoomY = currentRoomY - 1;
                player.y = SCREEN_HEIGHT - TILE_SIZE - player.height - 8;
                gameState = 'TRANSITION';
                transitionProgress = 0;
                audio.playTransition();
                projectiles = [];
                return;
            }
            // Door trigger - South
            else if (inXDoorway && player.y + player.height >= SCREEN_HEIGHT - 6) {
                nextRoomX = currentRoomX;
                nextRoomY = currentRoomY + 1;
                player.y = HUD_HEIGHT + TILE_SIZE + 8;
                gameState = 'TRANSITION';
                transitionProgress = 0;
                audio.playTransition();
                projectiles = [];
                return;
            }
            // Door trigger - West
            else if (inYDoorway && player.x <= 6) {
                nextRoomX = currentRoomX - 1;
                nextRoomY = currentRoomY;
                player.x = SCREEN_WIDTH - TILE_SIZE - player.width - 8;
                gameState = 'TRANSITION';
                transitionProgress = 0;
                audio.playTransition();
                projectiles = [];
                return;
            }
            // Door trigger - East
            else if (inYDoorway && player.x + player.width >= SCREEN_WIDTH - 6) {
                nextRoomX = currentRoomX + 1;
                nextRoomY = currentRoomY;
                player.x = TILE_SIZE + 8;
                gameState = 'TRANSITION';
                transitionProgress = 0;
                audio.playTransition();
                projectiles = [];
                return;
            }

            // Keep in bounds if not aligned with a doorway
            if (!inXDoorway) {
                player.y = Math.max(HUD_HEIGHT + TILE_SIZE, Math.min(SCREEN_HEIGHT - TILE_SIZE - player.height, player.y));
            }
            if (!inYDoorway) {
                player.x = Math.max(TILE_SIZE, Math.min(SCREEN_WIDTH - TILE_SIZE - player.width, player.x));
            }

            // Sword Attack Collisions
            if (player.isAttacking) {
                const arc = player.getSwordArc();

                // Break Pots
                for (let i = currentRoom.pots.length - 1; i >= 0; i--) {
                    const pot = currentRoom.pots[i];
                    if (checkRectOverlap(arc.box, pot)) {
                        audio.playPotSmash();
                        spawnSparkles(pot.x + 16, pot.y + 16, '#d98e42', 8);

                        if (Math.random() < 0.6) {
                            const dropType = Math.random() < 0.7 ? 'RUPEE' : 'HEART';
                            currentRoom.drops.push(new DropItem(pot.x + 4, pot.y + 4, dropType));
                        }
                        currentRoom.pots.splice(i, 1);
                    }
                }

                // Attack Enemies
                for (let i = currentRoom.enemies.length - 1; i >= 0; i--) {
                    const enemy = currentRoom.enemies[i];
                    const enemyBox = { x: enemy.x, y: enemy.y, w: enemy.width, h: enemy.height };

                    if (checkRectOverlap(arc.box, enemyBox) && enemy.isHit === 0) {
                        enemy.hp--;
                        enemy.isHit = 15;
                        audio.playHit();

                        if (enemy.hp <= 0) {
                            audio.playKill();
                            enemiesKilled++;
                            if (enemiesKilled > highScore) {
                                highScore = enemiesKilled;
                                localStorage.setItem('zelda_snes_highscore', highScore.toString());
                            }
                            spawnSparkles(enemy.x + 13, enemy.y + 13, '#f56565', 12);

                            if (Math.random() < 0.7) {
                                const dropType = Math.random() < 0.8 ? 'RUPEE' : 'HEART';
                                currentRoom.drops.push(new DropItem(enemy.x + 4, enemy.y + 4, dropType));
                            }
                            currentRoom.enemies.splice(i, 1);
                        }
                    }
                }
            }

            // Enemies Update & Player Hit Collision
            for (let enemy of currentRoom.enemies) {
                enemy.update(currentRoom.obstacles);

                if (player.invulnerableTimer === 0 && checkRectOverlap(
                    { x: player.x, y: player.y, w: player.width, h: player.height },
                    { x: enemy.x, y: enemy.y, w: enemy.width, h: enemy.height }
                )) {
                    player.health--;
                    player.invulnerableTimer = 40;
                    audio.playHit();

                    if (player.health <= 0) {
                        gameState = 'GAMEOVER';
                        audio.playGameOver();
                    }
                }
            }

            // Projectiles Update
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                proj.x += proj.vx;
                proj.y += proj.vy;
                proj.life--;

                if (player.invulnerableTimer === 0 && checkRectOverlap(
                    { x: player.x, y: player.y, w: player.width, h: player.height },
                    { x: proj.x, y: proj.y, w: 8, h: 8 }
                )) {
                    player.health--;
                    player.invulnerableTimer = 40;
                    audio.playHit();
                    projectiles.splice(i, 1);

                    if (player.health <= 0) {
                        gameState = 'GAMEOVER';
                        audio.playGameOver();
                    }
                    continue;
                }

                if (proj.life <= 0 || proj.x < 0 || proj.x > SCREEN_WIDTH || proj.y < HUD_HEIGHT || proj.y > SCREEN_HEIGHT) {
                    projectiles.splice(i, 1);
                }
            }

            // Pick Up Drops
            for (let i = currentRoom.drops.length - 1; i >= 0; i--) {
                const drop = currentRoom.drops[i];
                drop.update();

                if (drop.life <= 0) {
                    currentRoom.drops.splice(i, 1);
                    continue;
                }

                if (checkRectOverlap(
                    { x: player.x, y: player.y, w: player.width, h: player.height },
                    { x: drop.x, y: drop.y, w: 20, h: 20 }
                )) {
                    audio.playRupee();
                    if (drop.type === 'RUPEE') {
                        rupees += 1;
                    } else if (drop.type === 'HEART') {
                        player.health = Math.min(player.maxHealth, player.health + 2);
                    }
                    spawnSparkles(drop.x + 10, drop.y + 10, '#ffffff', 6);
                    currentRoom.drops.splice(i, 1);
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function render() {
            ctx.clearRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

            if (gameState === 'START') {
                drawStartScreen();
            } else if (gameState === 'PLAYING') {
                const currentRoom = getOrCreateRoom(currentRoomX, currentRoomY);
                drawRoom(currentRoom);

                for (let proj of projectiles) {
                    ctx.fillStyle = '#e04020';
                    ctx.fillRect(proj.x, proj.y, 8, 8);
                }

                for (let p of particles) {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }

                drawSNESPlayer();
                drawSNESHUD();
            } else if (gameState === 'TRANSITION') {
                drawTransition();
                drawSNESHUD();
            } else if (gameState === 'PAUSED') {
                const currentRoom = getOrCreateRoom(currentRoomX, currentRoomY);
                drawRoom(currentRoom);
                drawSNESPlayer();
                drawSNESHUD();
                drawPauseScreen();
            } else if (gameState === 'GAMEOVER') {
                const currentRoom = getOrCreateRoom(currentRoomX, currentRoomY);
                drawRoom(currentRoom);
                drawSNESPlayer();
                drawSNESHUD();
                drawGameOverScreen();
            }
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
            }
        }

        function getCanvasMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        window.addEventListener('keydown', (e) => {
            audio.init();

            if (e.code === 'Escape' || e.code === 'KeyP') {
                togglePause();
                return;
            }

            if (gameState === 'PAUSED') return;

            if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.up = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;

            if (e.code === 'Space' || e.code === 'KeyZ') triggerAttack();
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.up = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
        });

        const bindTouchBtn = (id, keyName) => {
            const btn = document.getElementById(id);
            if (!btn) return;

            const startAction = (e) => {
                e.preventDefault();
                audio.init();
                if (keyName === 'attack') triggerAttack();
                else keys[keyName] = true;
            };

            const endAction = (e) => {
                e.preventDefault();
                if (keyName !== 'attack') keys[keyName] = false;
            };

            btn.addEventListener('touchstart', startAction, { passive: false });
            btn.addEventListener('touchend', endAction, { passive: false });
            btn.addEventListener('mousedown', startAction);
            btn.addEventListener('mouseup', endAction);
        };

        bindTouchBtn('btnUp', 'up');
        bindTouchBtn('btnDown', 'down');
        bindTouchBtn('btnLeft', 'left');
        bindTouchBtn('btnRight', 'right');
        bindTouchBtn('btnAttack', 'attack');

        canvas.addEventListener('click', (e) => {
            audio.init();
            const pos = getCanvasMousePos(e);

            if (gameState === 'START') {
                // Clique no botão PT-BR
                if (pos.x >= 126 && pos.x <= 246 && pos.y >= 268 && pos.y <= 302) {
                    setLanguage('pt');
                    audio.playRupee();
                    return;
                }
                // Clique no botão ENGLISH
                if (pos.x >= 266 && pos.x <= 386 && pos.y >= 268 && pos.y <= 302) {
                    setLanguage('en');
                    audio.playRupee();
                    return;
                }
                // Clique no botão Jogar / Start
                if (pos.x >= 126 && pos.x <= 386 && pos.y >= 325 && pos.y <= 367) {
                    resetGame();
                    return;
                }
                return;
            }

            if (gameState === 'GAMEOVER') {
                // Botão Reiniciar Jogo
                if (pos.x >= 126 && pos.x <= 386 && pos.y >= 260 && pos.y <= 298) {
                    resetGame();
                }
                // Botão Menu Principal
                else if (pos.x >= 126 && pos.x <= 386 && pos.y >= 315 && pos.y <= 353) {
                    gameState = 'START';
                }
                return;
            }

            if (gameState === 'PLAYING') {
                // Pause button on HUD
                if (pos.x >= 462 && pos.x <= 502 && pos.y >= 12 && pos.y <= 52) {
                    togglePause();
                }
                return;
            }

            if (gameState === 'PAUSED') {
                // Continuar button
                if (pos.x >= 126 && pos.x <= 386 && pos.y >= 180 && pos.y <= 216) {
                    gameState = 'PLAYING';
                }
                // Reiniciar button
                else if (pos.x >= 126 && pos.x <= 386 && pos.y >= 230 && pos.y <= 266) {
                    resetGame();
                }
                // Menu Principal button
                else if (pos.x >= 126 && pos.x <= 386 && pos.y >= 280 && pos.y <= 316) {
                    gameState = 'START';
                }
            }
        });

        window.onload = function() {
            gameLoop();
        };
    </script>
